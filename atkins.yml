tasks:
  default:
    cmds:
      - go mod tidy
      - task: templ
      - task: go:fmt
      - task: go:test
      - task: go:build
      - task: examples
      - task: docs:api
      - task: docker:build

  templ:
    desc: "Generate templ components"
    passthru: true
    cmds:
      - templ generate
      - goimports -w .

  templ:verify:
    desc: "Fail when the generated components are out of date"
    passthru: true
    cmds:
      - templ generate
      - goimports -w .
      - git diff --exit-code -- '*_templ.go'

  examples:
    desc: "Build the wiring examples the docs link to"
    passthru: true
    cmds:
      # Their go.mod replaces oida with this checkout, so a change that breaks
      # the documented wiring breaks here.
      - go -C testdata/examples build ./...
      - go -C testdata/examples vet ./...

  lint:
    passthru: true
    cmds:
      - gofsck -skip-generated ./...
      - go-fsck lint ./...

  docs:api:
    desc: "Generate the API reference into docs/api.md"
    passthru: true
    cmds:
      - defer: rm -f go-fsck.json
      # Extracted without -r, so the reference holds the importable package
      # and not the command or the internal ones.
      - go-fsck extract . --include-sources
      - go-fsck docs > docs/api.md
      # mdox reflows the generated markdown; format here so the committed
      # file matches what the mdox:lint gate expects.
      - task: mdox:fmt

  gen:architecture:
    aliases: [gen]
    desc: "Generate architectural diagrams of the project"
    passthru: true
    cmds:
      - defer: rm -f go-fsck.json
      - go-fsck extract ./...
      - go-fsck docs --render imports | plantuml -tsvg -pipe > docs/assets/imports.svg
      - go-fsck docs --render puml | plantuml -tsvg -pipe > docs/assets/structure.svg
      - go-ddd-stats -d2 - | d2 --layout elk - docs/assets/size.svg
