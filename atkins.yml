tasks:
  default:
    cmds:
      - go mod tidy
      - task: templ
      - task: go:fmt
      - task: go:test
      - task: go:build
      - task: examples
      - task: docs:api
      - task: docs:coverage
      - task: gen
      - task: docker:build

  templ:
    desc: "Generate templ components"
    passthru: true
    cmds:
      - templ generate
      - goimports -w .

  templ:verify:
    desc: "Fail when the generated components are out of date"
    passthru: true
    cmds:
      - templ generate
      - goimports -w .
      - git diff --exit-code -- '*_templ.go'

  examples:
    desc: "Build the wiring examples the docs link to"
    passthru: true
    cmds:
      # Their go.mod replaces oida with this checkout, so a change that breaks
      # the documented wiring breaks here.
      - go -C testdata/examples build ./...
      - go -C testdata/examples vet ./...

  lint:
    passthru: true
    cmds:
      - splint ./...

  docs:api:
    desc: "Generate the API reference into docs/api.md"
    passthru: true
    cmds:
      - defer: rm -f splint.json go-fsck.json
      # Extracted without -r, so the reference holds the importable package
      # and not the command or the internal ones.
      - splint -include-sources -save . || true
      - go-fsck docs -i splint.json > docs/api.md
      # mdox reflows the generated markdown; format here so the committed
      # file matches what the mdox:lint gate expects.
      - task: mdox:fmt

  docs:coverage:
    desc: "Generate the coverage report into docs/testing-coverage.md"
    passthru: true
    cmds:
      - defer: rm -f pkg.cov splint.json
      - go test -count=1 -cover -coverpkg=./... -coverprofile=pkg.cov ./...
      # The extract reads the profile itself, so the coverage is in the
      # document splint writes rather than folded in by a second pass over a
      # summary of it. splint exits 1 on a finding, which is not this job.
      - splint -save --append-coverage=pkg.cov ./... || true
      - go-fsck coverage -i splint.json --template docs/testing-coverage.md.tpl > docs/testing-coverage.md
      - task: mdox:fmt

  gen:architecture:
    aliases: [gen]
    desc: "Generate architectural diagrams of the project"
    passthru: true
    cmds:
      - defer: rm -f splint.json go-fsck.json
      - splint -save ./... || true
      - go-fsck docs -i splint.json --render imports | plantuml -tsvg -pipe > docs/assets/imports.svg
      - go-fsck docs -i splint.json --render puml | plantuml -tsvg -pipe > docs/assets/structure.svg
