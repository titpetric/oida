tasks:
  default:
    cmds:
      - go mod tidy
      - task: templ
      - task: go:fmt
      - task: go:test
      - task: go:build
      - task: examples
      - task: docs:api
      - task: docs:coverage
      - task: gen
      - task: docker:build

  templ:
    desc: "Generate templ components"
    passthru: true
    cmds:
      - templ generate
      - splint fix ./...

  templ:verify:
    desc: "Fail when the generated components are out of date"
    passthru: true
    cmds:
      - templ generate
      - splint fix ./...
      - git diff --exit-code -- '*_templ.go'

  examples:
    desc: "Build the wiring examples the docs link to"
    passthru: true
    cmds:
      # Their go.mod replaces oida with this checkout, so a change that breaks
      # the documented wiring breaks here.
      - go -C testdata/examples build ./...
      - go -C testdata/examples vet ./...

  lint:
    passthru: true
    cmds:
      - splint ./...

  docs:api:
    desc: "Generate the API reference into docs/api.md"
    passthru: true
    cmds:
      - splint docs . > docs/api.md
      - task: mdox:fmt

  docs:coverage:
    desc: "Generate the coverage report into docs/testing-coverage.md"
    passthru: true
    cmds:
      - defer: rm -f pkg.cov
      - go test -count=1 -cover -coverpkg=./... -coverprofile=pkg.cov ./...
      - splint coverage --append-coverage=pkg.cov --template docs/testing-coverage.md.tpl ./... > docs/testing-coverage.md
      - task: mdox:fmt

  gen:architecture:
    aliases: [gen]
    desc: "Generate architectural diagrams of the project"
    passthru: true
    cmds:
      - defer: rm -f splint.json
      - splint --save ./...
      - splint docs --input splint.json --render imports | plantuml -tsvg -pipe > docs/assets/imports.svg
      - splint docs --input splint.json --render puml | plantuml -tsvg -pipe > docs/assets/structure.svg
